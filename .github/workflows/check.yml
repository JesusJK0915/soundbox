name: Release Check

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Generar archivos de plataforma Android
        run: flutter create --platforms=android --project-name soundbox --org com.soundbox .

      - name: Asegurar keystore debug
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v -keystore android/app/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Dependencias
        run: flutter pub get

      - name: Analisis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build APK release por ABI (check)
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=1.2.1 \
            --build-number=121 \
            --dart-define=UPDATE_CHANNEL=stable \
            --dart-define=UPDATE_BUILD=121

      - name: Subir artefacto de verificacion
        uses: actions/upload-artifact@v4
        with:
          name: soundbox-release-check-apks
          path: build/app/outputs/flutter-apk/app-*.apk
          if-no-files-found: error
